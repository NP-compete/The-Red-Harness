# Temporal, the durable execution server (E18-T2, D-15). Optional
# via `components.temporal` so a deployment that does not want it
# attempts no connection at all.
#
# Uses the Postgres already here; `auto-setup` creates its schemas
# on first boot. Single-node, and 72h retention is a dev default
# that would drop a multi-week job's history.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels:
    component: durable-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
        component: durable-execution
    spec:
      # Off everywhere in this deployment; see serviceLinks in values.yaml.
      enableServiceLinks: false
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.0
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postgres
            # From agent-secrets, as pgvector reads. Not optional:
            # a wrong Secret name must fail, not yield an empty
            # password and a "cannot connect to DB" crash loop.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: POSTGRES_PASSWORD
            # Its own databases beside the agent's, not inside it.
            - name: DBNAME
              value: temporal
            - name: VISIBILITY_DBNAME
              value: temporal_visibility
            - name: SERVICES
              value: "history,matching,frontend,worker"
            - name: SKIP_DEFAULT_NAMESPACE_CREATION
              value: "false"
            - name: DEFAULT_NAMESPACE
              value: default
            - name: DEFAULT_NAMESPACE_RETENTION
              value: "72h"
          ports:
            - containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
