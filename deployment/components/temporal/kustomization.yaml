apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - deployment.yaml
  - service.yaml

patches:
  # Where the worker and anything else reaches it. Written into the
  # shared ConfigMap rather than each Deployment's env, so turning
  # the component off removes the address with the server.
  - target:
      kind: ConfigMap
      name: agent-config
    patch: |-
      - op: add
        path: /data/TEMPORAL_ADDRESS
        value: "temporal:7233"
      - op: add
        path: /data/TEMPORAL_NAMESPACE
        value: "default"
