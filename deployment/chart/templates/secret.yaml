{{/*
Placeholders, not credentials.

The pod reads these by name, so the keys have to exist before it
starts — but a chart that ships a working password is a chart that
puts the same one in every cluster that installs it. Fill them with
`--set-string`, a values file kept out of the repository, or whatever
injects secrets at deploy time.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-secrets
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | default "" | quote }}
  {{- end }}
