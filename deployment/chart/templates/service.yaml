apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.networking.service.type }}
  selector:
    {{- include "agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.networking.service.port }}
      targetPort: http
      protocol: TCP
