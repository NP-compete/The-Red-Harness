# Generated by scripts/deploy/render_deployment.py from
# config/agent/deployment/values.yaml.
# Do not edit; run `make render-deployment`. A value changed
# only here is one the kustomize overlays never learn about,
# and which of the two a cluster got would depend on how it
# was installed.

components:
  postgres: true
  redis: true
  evalWorker: true
  scaleToZero: false
  externalChannels: false
  temporal: true
  worker: true
  documentsPvc: true
  configPvc: true
app:
  name: agent
  component: agent
  replicas: 2
  namespace: ai-agents
  serviceName: agent
  partOf: ai-factory
image:
  name: agent
  tag: latest
  registry: image-registry.openshift-image-registry.svc:5000
container:
  port: 5002
resources:
  requests:
    memory: 1536Mi
    cpu: 250m
  limits:
    memory: 8Gi
    cpu: 1000m
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetRunsInFlightPerPod: 25
  targetCPUUtilizationPercentage: 70
  scaleDown:
    stabilizationWindowSeconds: 900
    percentPerMinute: 10
datastores:
  postgres: pgvector/pgvector:pg16
  redis: redis:7-alpine
serviceLinks:
  enabled: false
drain:
  terminationGracePeriodSeconds: 600
  preStopSleepSeconds: 15
rollout:
  maxSurge: 1
  maxUnavailable: 0
  minReadySeconds: 30
  progressDeadlineSeconds: 600
probes:
  liveness:
    path: /livez
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 6
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
networking:
  service:
    type: ClusterIP
    port: 5002
  route:
    enabled: true
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  networkPolicy:
    enabled: true
    ingress:
    - from:
      - podSelector:
          matchLabels:
            app: template-ui
      ports:
      - port: 5002
storage:
  documents:
    size: 500Mi
    accessMode: ReadWriteMany
    storageClassName: ''
  config:
    size: 128Mi
    accessMode: ReadWriteOnce
    storageClassName: ''
scaleToZero:
  pollingIntervalSeconds: 15
  cooldownSeconds: 60
  scalerAddress: keda-add-ons-http-external-scaler.keda:9090
  host: ''
  targetPendingRequests: 20
build:
  resources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: '4'
config:
  AGENT_HOST: 0.0.0.0
  AGENT_PORT: '5002'
  PYTHON_LOG_LEVEL: INFO
  LANGFUSE_TRACING_ENVIRONMENT: production
  ENABLE_OTEL: 'false'
  OTEL_EXPORTER_OTLP_ENDPOINT: ''
  OTEL_EXPORTER_OTLP_INSECURE: 'true'
  OTEL_METRIC_EXPORT_INTERVAL: '60000'
  REQUEST_LOGGING_ENABLED: 'true'
  REQUEST_LOG_HEADERS: 'true'
  REQUEST_LOG_BODY: 'false'
  REQUEST_LOG_BODY_MAX_SIZE: '10240'
  REDIS_URL: redis://redis:6379/0
tuning:
  SQLALCHEMY_POOL_SIZE: '5'
  SQLALCHEMY_MAX_OVERFLOW: '10'
  LANGGRAPH_MIN_POOL_SIZE: '2'
  LANGGRAPH_MAX_POOL_SIZE: '12'
  DB_POOL_MIN_SIZE: '1'
  DB_POOL_MAX_SIZE: '8'
  DB_POOL_TIMEOUT: '10'
  DB_STATEMENT_TIMEOUT_MS: '30000'
  DB_POOL_MAX_IDLE: '300'
  DB_POOL_MAX_LIFETIME: '1800'
  MAX_CONCURRENT_RUNS: '40'
  DATETIME_PROMPT_GRANULARITY_SECONDS: '3600'
  REDIS_MAX_CONNECTIONS: '32'
  REDIS_SOCKET_TIMEOUT: '5'
  CACHE_ENABLED: 'true'
secrets:
  POSTGRES_HOST: <path:secret/data/<team>/<env>/agent#POSTGRES_HOST>
  POSTGRES_PORT: <path:secret/data/<team>/<env>/agent#POSTGRES_PORT>
  POSTGRES_DB: <path:secret/data/<team>/<env>/agent#POSTGRES_DB>
  POSTGRES_USER: <path:secret/data/<team>/<env>/agent#POSTGRES_USER>
  POSTGRES_PASSWORD: <path:secret/data/<team>/<env>/agent#POSTGRES_PASSWORD>
  SSO_ISSUER_URL: <path:secret/data/<team>/<env>/agent#SSO_ISSUER_URL>
  SSO_CLIENT_ID: <path:secret/data/<team>/<env>/agent#SSO_CLIENT_ID>
  SSO_CLIENT_SECRET: <path:secret/data/<team>/<env>/agent#SSO_CLIENT_SECRET>
  LANGFUSE_PUBLIC_KEY: <path:secret/data/<team>/<env>/agent#LANGFUSE_PUBLIC_KEY>
  LANGFUSE_SECRET_KEY: <path:secret/data/<team>/<env>/agent#LANGFUSE_SECRET_KEY>
  LANGFUSE_BASE_URL: <path:secret/data/<team>/<env>/agent#LANGFUSE_BASE_URL>
  GOOGLE_APPLICATION_CREDENTIALS_CONTENT: <path:secret/data/<team>/<env>/agent#GOOGLE_APPLICATION_CREDENTIALS_CONTENT>
  VLLM_BASE_URL: <path:secret/data/<team>/<env>/agent#VLLM_BASE_URL>
  VLLM_API_KEY: <path:secret/data/<team>/<env>/agent#VLLM_API_KEY>
  REDIS_URL: <path:secret/data/<team>/<env>/agent#REDIS_URL>
targets:
  kind:
    components:
      evalWorker: true
      temporal: true
      worker: true
    app:
      replicas: 2
