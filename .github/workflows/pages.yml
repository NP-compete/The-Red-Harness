name: Docs site

# Publishes docs/ as GitHub Pages.
#
# Builds on a pull request too, without deploying: a docs site that
# only fails after merge is a docs site that is broken on main for
# however long it takes somebody to look. The link checking is a
# unit test (`tests/unit/test_the_docs_site_has_no_orphans.py`), so
# a broken link fails the normal suite, not only this.
#
# Turning it on is one setting this file cannot set for you:
# Settings → Pages → Source → GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only when deploying. On a pull request this asked GitHub for a
      # Pages site that does not exist yet and failed the check with
      # "Get Pages site failed" — turning "the docs still build" into
      # a red cross about repository settings. Enabling Pages is a
      # deliberate act (Settings -> Pages -> Source -> GitHub Actions),
      # not something CI should do on the way past.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
        if: github.event_name != 'pull_request'

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'

  deploy:
    name: Deploy
    # Not on a pull request: a fork opening one would otherwise
    # publish to the live site.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
