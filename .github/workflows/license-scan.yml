name: License Compliance

on:
  push:
    branches: [main, deep-agent]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - 'Containerfile'
      # The interface's dependencies live here since the
      # merge; its own license scan watched these and this
      # one did not know the files existed.
      - 'ui/package.json'
      - 'ui/package-lock.json'
  pull_request:
    branches: [main, deep-agent]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements*.txt'
      - 'Containerfile'
      # The interface's dependencies live here since the
      # merge; its own license scan watched these and this
      # one did not know the files existed.
      - 'ui/package.json'
      - 'ui/package-lock.json'

permissions:
  contents: read

jobs:
  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Hardened as the interface's copy already was.
          # Not done in tag.yml, which pushes a tag and
          # needs the credential it would drop.
          persist-credentials: false

      - name: Scan for license violations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: UNKNOWN,HIGH,CRITICAL
          exit-code: '1'
          trivy-config: trivy-license.yaml
