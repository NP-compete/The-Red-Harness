name: Interface

# The interface's CI, folded in when template-ui became `services/ui/`
# (D-8, E10 strand B). It was the only thing running these tests,
# and `test.yml` does not know the directory exists — deleting the
# old repository's workflows without this would have dropped the
# coverage silently, which is the usual way a merge loses a suite.
#
# A workflow of its own rather than jobs bolted onto `test.yml`:
# the two have different triggers. Nothing here needs to run when
# only Python changed, and `paths` below says so.

permissions:
  contents: read

on:
  push:
    branches: [ main, deep-agent ]
    paths:
      - 'services/ui/**'
      - '.github/workflows/ui.yml'
  pull_request:
    branches: [ main, deep-agent ]
    paths:
      - 'services/ui/**'
      - '.github/workflows/ui.yml'

# Every `run` is in services/ui/, and setup-node is told where the lockfile
# lives or it caches nothing and silently reinstalls each job.
defaults:
  run:
    working-directory: services/ui

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/ui/package-lock.json
      - run: npm ci
      - run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/ui/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  # Three scripts that each exit non-zero on a real problem and
  # which nothing ran. `i18n-missing.mjs` says so in its own
  # docstring — "usable in CI" — and was in no workflow and no
  # Makefile target; a key a component asks for and the catalogue
  # lacks renders as `settings.saveLabel` on screen, because
  # i18next falls back to the key and nothing else notices. The
  # other two guard generated files that are committed: the
  # contract against the agent's OpenAPI baseline, and the
  # deployment overlays against their input. All three passed
  # when this job was added, which is the point — a check is
  # worth having before it is needed, not after.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/ui/package-lock.json
      - run: npm ci
      - run: npm run i18n:missing
      - run: npm run i18n:report
      - run: npm run contract:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: services/ui/dist/
          retention-days: 1
          # vite writes the asset manifest to `dist/frontend/.vite/`, and
          # upload-artifact drops dotted paths unless told otherwise. The
          # e2e job then downloaded a dist the server refuses to start on
          # — `client.router.ts` reads that manifest at boot — and the
          # only symptom was playwright timing out waiting for a port.
          include-hidden-files: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    container:
      # Tracks @playwright/test in package.json exactly: the image
      # ships the browser build that version expects, and a mismatch
      # fails every test in 3ms with "Executable doesn't exist".
      # Pinned by digest, like every action in this repo. The tag
      # is kept alongside so the version stays readable; it is the
      # digest that is fetched.
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/ui/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: services/ui/dist/
      - run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: services/ui/playwright-report/
          retention-days: 7
