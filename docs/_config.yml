# GitHub Pages builds this directory with Jekyll.
#
# No per-page front matter anywhere, on purpose: `cli.md` and
# `config-reference.md` are regenerated by `make cli-docs` and
# `make config-reference`, and CI fails when they differ from what
# the generator produces. A theme that needed a `title:` block in
# every file would put those two permanently one step from stale.
# Navigation lives in `index.md` instead, and a test keeps it honest.
title: The Red Harness
description: An agent you configure rather than fork.
theme: jekyll-theme-cayman

# Relative links between docs resolve the same on the site as they
# do in the repository, so `[x](runbook.md)` works in both.
relative_links:
  enabled: true
  collections: true

include:
  - adr
  - security

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
